name: Daily bilingual market education
on:
  schedule:
    - cron: '13 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketpulse-daily
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish bilingual educational post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/daily.py
