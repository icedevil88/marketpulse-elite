name: Daily bilingual market education
on:
  schedule:
    - cron: '13 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: marketpulse-daily
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publisher offline
        run: python -m unittest discover -s tests -v
      - name: Read persistent publication ledger
        uses: actions/checkout@v4
        with:
          ref: refs/heads/marketpulse-state
          path: .publication-state
      - name: Identify original run day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          created="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          echo "RUN_CREATED_AT=$created" >> "$GITHUB_ENV"
      - name: Publish bilingual educational post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/daily.py --publish --state-dir .publication-state
